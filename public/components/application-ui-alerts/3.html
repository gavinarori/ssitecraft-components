<!--
  Error alert - animated
  - Slides in, then one gentle shake and a red pulse to draw attention (plays once)
  - Errors never auto-dismiss: they stay until the problem is resolved
  - Announced immediately to screen readers (role=alert)
  - Honors prefers-reduced-motion
-->
<style>
  /* ---------- Alert motion (self-contained: no Tailwind config needed) ---------- */
  .sc-alert {
    --sc-ease: cubic-bezier(0.22, 1, 0.36, 1);
    position: relative;
    overflow: hidden;
    animation: sc-alert-in 480ms var(--sc-ease) backwards;
  }
  /* Staggered reveal: add data-stagger and style="--i:N" to any child */
  .sc-alert [data-stagger] {
    animation: sc-rise 420ms var(--sc-ease) both;
    animation-delay: calc(var(--i, 0) * 70ms + 160ms);
  }
  @keyframes sc-alert-in {
    from {
      opacity: 0;
      transform: translateY(-10px) scale(0.98);
    }
  }
  @keyframes sc-rise {
    from {
      opacity: 0;
      transform: translateY(6px);
    }
  }

  /* Attention cue: one gentle shake and one red pulse, then calm */
  .sc-alert--error {
    animation:
      sc-alert-in 480ms var(--sc-ease) backwards,
      sc-shake 480ms 380ms ease-in-out,
      sc-pulse-red 900ms 380ms ease-out;
  }
  @keyframes sc-shake {
    20% {
      transform: translateX(-6px);
    }
    40% {
      transform: translateX(5px);
    }
    60% {
      transform: translateX(-3px);
    }
    80% {
      transform: translateX(2px);
    }
  }
  @keyframes sc-pulse-red {
    from {
      box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.35);
    }
    to {
      box-shadow: 0 0 0 14px rgba(239, 68, 68, 0);
    }
  }

  /* Respect users who prefer reduced motion */
  @media (prefers-reduced-motion: reduce) {
    .sc-alert,
    .sc-alert * {
      animation: none !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>

<div role="alert" class="sc-alert sc-alert--error rounded border-s-4 border-red-500 bg-red-50 p-4">
  <strong data-stagger style="--i: 0" class="block font-medium text-red-800"> Something went wrong </strong>

  <p data-stagger style="--i: 1" class="mt-2 text-sm text-red-700">
    Lorem ipsum dolor sit amet consectetur, adipisicing elit. Nemo quasi assumenda numquam deserunt
    consectetur autem nihil quos debitis dolor culpa.
  </p>
</div>
