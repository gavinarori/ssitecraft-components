<!--
  Skyline - sign-up with building cut-out
  HOW TO USE
  1. Paste this whole file where you want the page.
  2. Image slots are marked with IMAGE comments: replace the link inside src="".
  3. Change the text and links. Colors are CSS variables at the top of the <style> block.
  - Right side expects a transparent PNG; the soft shadow glow is pure CSS
  - Password show/hide works
-->
<style>
  @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Playfair+Display:ital,wght@1,500&display=swap");

  .login-skylinesignup * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  .login-skylinesignup {
    box-sizing: border-box;
    min-height: max(100vh, 640px);
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font), system-ui, sans-serif;
  }
  .login-skylinesignup a {
    color: inherit;
    text-decoration: none;
  }
  .login-skylinesignup img {
    display: block;
    object-fit: cover;
    background: #cfcfd6;
  }
  .login-skylinesignup .ico {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .login-skylinesignup .label {
    display: block;
    margin-bottom: 10px;
    font-size: 14px;
    font-weight: 500;
  }
  .login-skylinesignup .input {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 50px;
    padding: 0 18px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--field);
    color: var(--muted);
    transition:
      border-color 0.2s,
      box-shadow 0.2s;
  }
  .login-skylinesignup .input:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--ring);
  }
  .login-skylinesignup .input input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--ink);
    font:
      400 14px var(--font),
      sans-serif;
  }
  .login-skylinesignup .input input::placeholder {
    color: var(--muted);
  }
  .login-skylinesignup .eye {
    display: grid;
    place-items: center;
    padding: 4px;
    border: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: color 0.2s;
  }
  .login-skylinesignup .eye:hover,
  .login-skylinesignup .eye[aria-pressed="true"] {
    color: var(--ink);
  }
  .login-skylinesignup .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    height: 50px;
    border: 1px solid transparent;
    border-radius: var(--radius);
    font:
      500 15px var(--font),
      sans-serif;
    cursor: pointer;
    transition:
      transform 0.2s,
      box-shadow 0.25s,
      background 0.2s;
  }
  .login-skylinesignup .btn:hover {
    transform: translateY(-1px);
  }
  .login-skylinesignup .btn--primary {
    background: var(--accent);
    color: var(--accent-ink);
  }
  .login-skylinesignup .btn--primary:hover {
    box-shadow: 0 14px 26px -14px var(--accent);
  }
  .login-skylinesignup .btn--outline {
    border-color: var(--line);
    background: transparent;
    color: var(--ink);
    font-weight: 400;
  }
  .login-skylinesignup .btn--outline:hover {
    background: var(--hover);
  }
  .login-skylinesignup .btn .brand {
    width: 20px;
    height: 20px;
  }
  .login-skylinesignup .divider {
    display: flex;
    align-items: center;
    gap: 14px;
    color: var(--muted);
    font-size: 14px;
  }
  .login-skylinesignup .divider::before,
  .login-skylinesignup .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  .login-skylinesignup .check {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
  }
  .login-skylinesignup .check input {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
  }
  .login-skylinesignup .link {
    color: var(--accent);
    font-weight: 500;
  }
  .login-skylinesignup .link:hover {
    text-decoration: underline;
  }
  .login-skylinesignup .stack {
    display: grid;
    gap: 18px;
  }
  .login-skylinesignup .dots {
    display: flex;
    gap: 9px;
  }
  .login-skylinesignup .dots i {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.3);
    transition: transform 0.2s;
  }
  .login-skylinesignup .dots i:first-child {
    background: #fff;
  }
  .login-skylinesignup .dots i:hover {
    transform: scale(1.25);
  }
  @keyframes login-pulse {
    0% {
      transform: scale(0.8);
      opacity: 0.9;
    }
    100% {
      transform: scale(1.5);
      opacity: 0;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .login-skylinesignup * {
      animation: none !important;
      transition: none !important;
    }
  }

  .login-skylinesignup {
    --bg: #fff;
    --ink: #161616;
    --muted: #8c8c8c;
    --line: #e6e6e6;
    --field: #fff;
    --hover: #f8f8f8;
    --accent: #e0592a;
    --accent-ink: #fff;
    --ring: rgba(224, 89, 42, 0.16);
    --radius: 12px;
    --font: Outfit;
    display: grid;
    grid-template-columns: 1fr 1.1fr;
    align-items: center;
  }
  .login-skylinesignup .panel {
    width: min(442px, 100% - 48px);
    margin: 0 auto;
    padding: 40px 0;
  }
  .login-skylinesignup .logo {
    display: flex;
    align-items: center;
    gap: 16px;
    font:
      italic 500 42px "Playfair Display",
      serif;
  }
  .login-skylinesignup .logo svg {
    width: 52px;
    height: 40px;
  }
  .login-skylinesignup .welcome {
    margin: 16px 0 34px;
    color: var(--muted);
    font-size: 15px;
  }
  .login-skylinesignup .socials {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .login-skylinesignup .btn--outline {
    height: 50px;
    font-size: 15px;
  }
  .login-skylinesignup hr {
    margin: 28px 0;
    border: 0;
    border-top: 1px solid var(--line);
  }
  .login-skylinesignup .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .login-skylinesignup .form {
    display: grid;
    gap: 18px;
  }
  .login-skylinesignup .form .label {
    font-weight: 600;
  }
  .login-skylinesignup .check {
    color: var(--muted);
  }
  .login-skylinesignup .check b {
    color: #555;
    font-weight: 600;
  }
  .login-skylinesignup .btn--primary {
    width: auto;
    align-self: start;
    justify-self: start;
    padding: 0 28px;
    border-radius: 999px;
    margin-top: 6px;
  }
  .login-skylinesignup .foot {
    margin-top: 28px;
    color: var(--muted);
  }
  .login-skylinesignup .showcase {
    position: relative;
    display: grid;
    place-items: center;
    height: 100%;
    min-height: 640px;
    overflow: hidden;
  }
  .login-skylinesignup .glow {
    position: absolute;
    inset: 10% 4% 6% 14%;
    border-radius: 50%;
    background: radial-gradient(
      ellipse at 55% 55%,
      rgba(0, 0, 0, 0.09),
      rgba(0, 0, 0, 0.04) 45%,
      transparent 70%
    );
    filter: blur(24px);
  }
  .login-skylinesignup .showcase img {
    position: relative;
    width: min(640px, 100%);
    height: auto;
    max-height: 86vh;
    object-fit: contain;
    background: transparent;
    animation: skyline-rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes skyline-rise {
    from {
      opacity: 0;
      transform: translateY(24px);
    }
  }
  @media (max-width: 900px) {
    .login-skylinesignup {
      grid-template-columns: 1fr;
    }
    .login-skylinesignup .showcase {
      display: none;
    }
    .login-skylinesignup .socials,
    .login-skylinesignup .row {
      grid-template-columns: 1fr;
    }
  }
</style>

<section class="login-skylinesignup">
  <!-- Form -->
  <div class="panel">
    <a href="#" class="logo"
      ><svg viewBox="0 0 44 34" aria-hidden="true">
        <ellipse
          cx="22"
          cy="18"
          rx="20"
          ry="6.5"
          transform="rotate(-18 22 18)"
          fill="none"
          stroke="#e0592a"
          stroke-width="2.6"
        />
        <circle cx="22" cy="17" r="11.5" fill="#e0592a" />
        <path
          d="M13 15c5-6.5 14-4.5 17.500 2"
          stroke="#fff"
          stroke-opacity=".55"
          stroke-width="2"
          fill="none"
          stroke-linecap="round"
        />
      </svg>
      Sitecraft</a
    >
    <p class="welcome">Welcome! We're thrilled to have you</p>
    <div class="socials">
      <button class="btn btn--outline" type="button">
        <svg class="brand" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
          />
          <path
            fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
          />
          <path
            fill="#FBBC05"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
          />
          <path
            fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
          />
        </svg>
        Signup with Google
      </button>
      <button class="btn btn--outline" type="button">
        <svg class="brand" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="currentColor"
            d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"
          />
        </svg>
        Signup with Apple
      </button>
    </div>
    <hr />
    <form class="form" action="#">
      <div class="row">
        <div>
          <label class="label" for="ss-name">Name</label>
          <div class="input"><input id="ss-name" type="text" placeholder="John Walker" /></div>
        </div>
        <div>
          <label class="label" for="ss-email">Email</label>
          <div class="input"><input id="ss-email" type="email" placeholder="hello@skyline.co" /></div>
        </div>
      </div>
      <div>
        <label class="label" for="ss-pass">Password</label>
        <div class="input">
          <input id="ss-pass" type="password" placeholder="••••••••" autocomplete="off" /><button
            type="button"
            class="eye"
            data-toggle-password
            aria-label="Show password"
            aria-pressed="false"
          >
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"
              />
              <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </button>
        </div>
      </div>
      <label class="check"
        ><input type="checkbox" />
        <span>Agree to the <b>terms of service</b> and our <b>privacy policy</b></span></label
      >
      <button class="btn btn--primary" type="submit">Sign up</button>
    </form>
    <p class="foot">Already have an account? <a href="#" class="link">Sign in</a></p>
  </div>

  <!-- Building cut-out on a soft glow -->
  <div class="showcase">
    <div class="glow" aria-hidden="true"></div>
    <!-- IMAGE (Building cut-out): use a transparent PNG, about 700px wide. Replace the link in src="" -->
    <img
      src="https://images.unsplash.com/photo-1501688639626-9804fb1ad475?q=80&w=1475&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
      alt="Modern apartment building"
      width="700"
      height="900"
    />
  </div>
</section>
<script>
  /* Show / hide password. Safe to include more than once. */
  document.querySelectorAll("[data-toggle-password]").forEach(function (btn) {
    if (btn.dataset.ready) return;
    btn.dataset.ready = "1";
    btn.addEventListener("click", function () {
      var input = btn.parentElement.querySelector("input");
      var show = input.type === "password";
      input.type = show ? "text" : "password";
      btn.setAttribute("aria-pressed", show);
    });
  });
</script>
