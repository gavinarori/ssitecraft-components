<!--
  Winzy - split sign-up with full-height photo
  HOW TO USE
  1. Paste this whole file where you want the page.
  2. Image slots are marked with IMAGE comments: replace the link inside src="".
  3. Change the text and links. Colors are CSS variables at the top of the <style> block.
  - Full-height photo on the left, email sign-up on the right
-->
<style>
  @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap");

  .login-winzysignup * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  .login-winzysignup {
    box-sizing: border-box;
    min-height: max(100vh, 640px);
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font), system-ui, sans-serif;
  }
  .login-winzysignup a {
    color: inherit;
    text-decoration: none;
  }
  .login-winzysignup img {
    display: block;
    object-fit: cover;
    background: #cfcfd6;
  }
  .login-winzysignup .ico {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .login-winzysignup .label {
    display: block;
    margin-bottom: 10px;
    font-size: 14px;
    font-weight: 500;
  }
  .login-winzysignup .input {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 50px;
    padding: 0 18px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--field);
    color: var(--muted);
    transition:
      border-color 0.2s,
      box-shadow 0.2s;
  }
  .login-winzysignup .input:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--ring);
  }
  .login-winzysignup .input input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--ink);
    font:
      400 14px var(--font),
      sans-serif;
  }
  .login-winzysignup .input input::placeholder {
    color: var(--muted);
  }
  .login-winzysignup .eye {
    display: grid;
    place-items: center;
    padding: 4px;
    border: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: color 0.2s;
  }
  .login-winzysignup .eye:hover,
  .login-winzysignup .eye[aria-pressed="true"] {
    color: var(--ink);
  }
  .login-winzysignup .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    height: 50px;
    border: 1px solid transparent;
    border-radius: var(--radius);
    font:
      500 15px var(--font),
      sans-serif;
    cursor: pointer;
    transition:
      transform 0.2s,
      box-shadow 0.25s,
      background 0.2s;
  }
  .login-winzysignup .btn:hover {
    transform: translateY(-1px);
  }
  .login-winzysignup .btn--primary {
    background: var(--accent);
    color: var(--accent-ink);
  }
  .login-winzysignup .btn--primary:hover {
    box-shadow: 0 14px 26px -14px var(--accent);
  }
  .login-winzysignup .btn--outline {
    border-color: var(--line);
    background: transparent;
    color: var(--ink);
    font-weight: 400;
  }
  .login-winzysignup .btn--outline:hover {
    background: var(--hover);
  }
  .login-winzysignup .btn .brand {
    width: 20px;
    height: 20px;
  }
  .login-winzysignup .divider {
    display: flex;
    align-items: center;
    gap: 14px;
    color: var(--muted);
    font-size: 14px;
  }
  .login-winzysignup .divider::before,
  .login-winzysignup .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  .login-winzysignup .check {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
  }
  .login-winzysignup .check input {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
  }
  .login-winzysignup .link {
    color: var(--accent);
    font-weight: 500;
  }
  .login-winzysignup .link:hover {
    text-decoration: underline;
  }
  .login-winzysignup .stack {
    display: grid;
    gap: 18px;
  }
  .login-winzysignup .dots {
    display: flex;
    gap: 9px;
  }
  .login-winzysignup .dots i {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.3);
    transition: transform 0.2s;
  }
  .login-winzysignup .dots i:first-child {
    background: #fff;
  }
  .login-winzysignup .dots i:hover {
    transform: scale(1.25);
  }
  @keyframes login-pulse {
    0% {
      transform: scale(0.8);
      opacity: 0.9;
    }
    100% {
      transform: scale(1.5);
      opacity: 0;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .login-winzysignup * {
      animation: none !important;
      transition: none !important;
    }
  }

  .login-winzysignup {
    --bg: #fff;
    --ink: #0b0b0b;
    --muted: #8a8a8a;
    --line: #dcdcdc;
    --field: #f4f4f4;
    --hover: #f8f8f8;
    --accent: #ff2a2a;
    --accent-ink: #fff;
    --ring: rgba(255, 42, 42, 0.16);
    --radius: 999px;
    --font: "Plus Jakarta Sans";
    display: grid;
    grid-template-columns: 42% 58%;
  }
  .login-winzysignup .photo {
    position: relative;
    min-height: 640px;
    color: #fff;
    overflow: hidden;
  }
  .login-winzysignup .photo > img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .login-winzysignup .photo .brand {
    position: absolute;
    top: 28px;
    left: 36px;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 22px;
    font-weight: 500;
  }
  .login-winzysignup .photo .brand svg {
    width: 26px;
    height: 26px;
  }
  .login-winzysignup .shade {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(0, 0, 0, 0.28), transparent 25%);
  }
  .login-winzysignup .panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: min(476px, 100% - 48px);
    margin: 0 auto;
    padding: 48px 0;
    text-align: center;
  }
  .login-winzysignup .mark {
    width: 48px;
    height: 48px;
    color: var(--accent);
  }
  .login-winzysignup h1 {
    margin: 30px 0 16px;
    font-size: clamp(30px, 3.6vw, 42px);
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: -0.02em;
  }
  .login-winzysignup .lead {
    margin-bottom: 34px;
    color: var(--muted);
    font-size: 16px;
    line-height: 1.5;
  }
  .login-winzysignup .socials {
    display: grid;
    gap: 12px;
    width: 100%;
  }
  .login-winzysignup .btn--outline {
    height: 50px;
    color: var(--ink);
  }
  .login-winzysignup .or {
    margin: 28px 0 20px;
    color: var(--muted);
    font-size: 14px;
  }
  .login-winzysignup .form {
    display: grid;
    gap: 18px;
    width: 100%;
  }
  .login-winzysignup .input {
    border-color: transparent;
  }
  .login-winzysignup .btn--primary {
    background: #000;
    color: #fff;
  }
  .login-winzysignup .btn--primary:hover {
    box-shadow: 0 14px 26px -14px #000;
  }
  .login-winzysignup .foot {
    margin-top: 18px;
    font-size: 14px;
  }
  @media (max-width: 900px) {
    .login-winzysignup {
      grid-template-columns: 1fr;
    }
    .login-winzysignup .photo {
      display: none;
    }
  }
</style>

<section class="login-winzysignup">
  <!-- Photo -->
  <div class="photo">
    <!-- IMAGE (Side photo): replace the link in src="" with your own image -->
    <img
      src="https://images.unsplash.com/photo-1789758612601-6203670d039a?q=80&w=1473&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDE%3D"
      alt="Seaside villa at dusk"

    <form class="form" action="#">

    <p class="foot">Already a member? <a href="#" class="link">Log in</a></p>
  </div>
</section>
