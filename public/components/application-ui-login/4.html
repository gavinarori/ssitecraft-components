<!--
  Chainex - dark sign-up with product showcase
  HOW TO USE
  1. Paste this whole file where you want the page.
  2. Image slots are marked with IMAGE comments: replace the link inside src="".
  3. Change the text and links. Colors are CSS variables at the top of the <style> block.
  - Password fields have a working show/hide button
  - Right side: animated chart mock-up with floating glass cards (4 icon slots)
-->
<style>
  @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap");

  .login-chainexsignup * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  .login-chainexsignup {
    box-sizing: border-box;
    min-height: max(100vh, 640px);
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font), system-ui, sans-serif;
  }
  .login-chainexsignup a {
    color: inherit;
    text-decoration: none;
  }
  .login-chainexsignup img {
    display: block;
    object-fit: cover;
    background: #cfcfd6;
  }
  .login-chainexsignup .ico {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .login-chainexsignup .label {
    display: block;
    margin-bottom: 10px;
    font-size: 14px;
    font-weight: 500;
  }
  .login-chainexsignup .input {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 50px;
    padding: 0 18px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--field);
    color: var(--muted);
    transition:
      border-color 0.2s,
      box-shadow 0.2s;
  }
  .login-chainexsignup .input:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--ring);
  }
  .login-chainexsignup .input input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--ink);
    font:
      400 14px var(--font),
      sans-serif;
  }
  .login-chainexsignup .input input::placeholder {
    color: var(--muted);
  }
  .login-chainexsignup .eye {
    display: grid;
    place-items: center;
    padding: 4px;
    border: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: color 0.2s;
  }
  .login-chainexsignup .eye:hover,
  .login-chainexsignup .eye[aria-pressed="true"] {
    color: var(--ink);
  }
  .login-chainexsignup .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    height: 50px;
    border: 1px solid transparent;
    border-radius: var(--radius);
    font:
      500 15px var(--font),
      sans-serif;
    cursor: pointer;
    transition:
      transform 0.2s,
      box-shadow 0.25s,
      background 0.2s;
  }
  .login-chainexsignup .btn:hover {
    transform: translateY(-1px);
  }
  .login-chainexsignup .btn--primary {
    background: var(--accent);
    color: var(--accent-ink);
  }
  .login-chainexsignup .btn--primary:hover {
    box-shadow: 0 14px 26px -14px var(--accent);
  }
  .login-chainexsignup .btn--outline {
    border-color: var(--line);
    background: transparent;
    color: var(--ink);
    font-weight: 400;
  }
  .login-chainexsignup .btn--outline:hover {
    background: var(--hover);
  }
  .login-chainexsignup .btn .brand {
    width: 20px;
    height: 20px;
  }
  .login-chainexsignup .divider {
    display: flex;
    align-items: center;
    gap: 14px;
    color: var(--muted);
    font-size: 14px;
  }
  .login-chainexsignup .divider::before,
  .login-chainexsignup .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  .login-chainexsignup .check {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
  }
  .login-chainexsignup .check input {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
  }
  .login-chainexsignup .link {
    color: var(--accent);
    font-weight: 500;
  }
  .login-chainexsignup .link:hover {
    text-decoration: underline;
  }
  .login-chainexsignup .stack {
    display: grid;
    gap: 18px;
  }
  .login-chainexsignup .dots {
    display: flex;
    gap: 9px;
  }
  .login-chainexsignup .dots i {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.3);
    transition: transform 0.2s;
  }
  .login-chainexsignup .dots i:first-child {
    background: #fff;
  }
  .login-chainexsignup .dots i:hover {
    transform: scale(1.25);
  }
  @keyframes login-pulse {
    0% {
      transform: scale(0.8);
      opacity: 0.9;
    }
    100% {
      transform: scale(1.5);
      opacity: 0;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .login-chainexsignup * {
      animation: none !important;
      transition: none !important;
    }
  }

  .login-chainexsignup {
    --bg: #101015;
    --ink: #fff;
    --muted: #8b8b95;
    --line: #2a2a33;
    --field: transparent;
    --hover: rgba(255, 255, 255, 0.05);
    --accent: #3fb086;
    --accent-ink: #fff;
    --ring: rgba(63, 176, 134, 0.18);
    --radius: 999px;
    --font: Inter;
    display: grid;
    grid-template-columns: 44% 56%;
  }
  .login-chainexsignup .panel {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 26px;
    padding: 48px clamp(24px, 16%, 96px);
  }
  .login-chainexsignup .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 19px;
    font-weight: 600;
  }
  .login-chainexsignup .logo svg {
    width: 32px;
    height: 32px;
  }
  .login-chainexsignup h1 {
    font-size: 34px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .login-chainexsignup .sub {
    margin-top: 8px;
    font-size: 14px;
    font-weight: 500;
  }
  .login-chainexsignup .form {
    display: grid;
    gap: 14px;
  }
  .login-chainexsignup .form .label {
    margin-bottom: 8px;
  }
  .login-chainexsignup .btn--primary {
    margin-top: 2px;
  }
  .login-chainexsignup .foot {
    text-align: center;
    font-size: 14px;
    font-weight: 500;
  }
  .login-chainexsignup .stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    overflow: hidden;
    padding: 70px 3% 48px;
    background:
      radial-gradient(ellipse 70% 55% at 55% 60%, rgba(63, 176, 134, 0.2), transparent 70%),
      linear-gradient(135deg, #0b0d0c, #0a120e);
  }
  .login-chainexsignup .mock {
    position: relative;
    width: min(640px, 92%);
    height: min(430px, 56vh);
    min-height: 340px;
  }
  .login-chainexsignup .chart {
    position: absolute;
    inset: 60px 0 24px 4%;
    display: grid;
    grid-template-columns: 34px 1fr 48px;
    gap: 10px;
    padding: 14px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.03);
  }
  .login-chainexsignup .chart-top {
    position: absolute;
    top: 14px;
    left: 14px;
    right: 14px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  .login-chainexsignup .tool {
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.07);
    color: #aaa;
  }
  .login-chainexsignup .tool .ico {
    width: 14px;
    height: 14px;
  }
  .login-chainexsignup .rail {
    align-self: end;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 12px 7px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.07);
    color: #aaa;
    margin-bottom: -4px;
  }
  .login-chainexsignup .rail .ico {
    width: 14px;
    height: 14px;
  }
  .login-chainexsignup .chart-svg {
    align-self: end;
    width: 100%;
    height: 76%;
  }
  .login-chainexsignup .axis {
    align-self: end;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 70%;
    font-size: 11px;
    color: #9a9aa3;
  }
  .login-chainexsignup .bubble {
    position: absolute;
    top: 44%;
    left: 42%;
    padding: 5px 12px;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.1);
    font-size: 10px;
  }
  .login-chainexsignup .float {
    position: absolute;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 88px;
    padding: 14px 8px 12px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 22px;
    background: rgba(40, 42, 48, 0.55);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    font-size: 13px;
    box-shadow: 0 20px 40px -16px rgba(0, 0, 0, 0.6);
    animation: chainex-float 6s ease-in-out infinite;
  }
  .login-chainexsignup .float img {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: #33353b;
  }
  .login-chainexsignup .float--blog {
    top: 0;
    left: 15%;
  }
  .login-chainexsignup .float--news {
    top: 30px;
    right: 16%;
    animation-delay: -2s;
  }
  .login-chainexsignup .float--invest {
    bottom: 0;
    left: -2%;
    animation-delay: -4s;
  }
  .login-chainexsignup .float--bot {
    bottom: 50px;
    right: -4%;
    animation-delay: -1s;
  }
  .login-chainexsignup .marker {
    position: absolute;
    width: 92px;
    height: 92px;
    opacity: 0.9;
  }
  .login-chainexsignup .marker::before,
  .login-chainexsignup .marker::after {
    content: "";
    position: absolute;
    background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.55) 0 5px, transparent 5px 9px);
  }
  .login-chainexsignup .marker::before {
    left: 0;
    right: 0;
    top: 50%;
    height: 1px;
  }
  .login-chainexsignup .marker::after {
    top: 0;
    bottom: 0;
    left: 50%;
    width: 1px;
    background: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.55) 0 5px, transparent 5px 9px);
  }
  .login-chainexsignup .marker i {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #fff;
    transform: translate(-50%, -50%);
    z-index: 1;
    box-shadow: 0 0 0 0 rgba(63, 176, 134, 0.6);
    animation: chainex-ping 2.4s infinite;
  }
  .login-chainexsignup .marker--a {
    top: -8px;
    left: -6%;
  }
  .login-chainexsignup .marker--b {
    top: 20px;
    right: -12%;
  }
  .login-chainexsignup .marker--c {
    bottom: -30px;
    left: 26%;
  }
  .login-chainexsignup .intro {
    text-align: center;
    max-width: 430px;
  }
  .login-chainexsignup .intro h2 {
    font-size: 42px;
    font-weight: 800;
    letter-spacing: -0.03em;
  }
  .login-chainexsignup .intro p {
    margin: 18px 0 14px;
    font-size: 14px;
    line-height: 1.55;
  }
  .login-chainexsignup .intro .dots {
    justify-content: center;
  }
  @keyframes chainex-float {
    50% {
      transform: translateY(-8px);
    }
  }
  @keyframes chainex-ping {
    70% {
      box-shadow: 0 0 0 12px rgba(63, 176, 134, 0);
    }
    100% {
      box-shadow: 0 0 0 0 rgba(63, 176, 134, 0);
    }
  }
  @media (max-width: 900px) {
    .login-chainexsignup {
      grid-template-columns: 1fr;
    }
    .login-chainexsignup .stage {
      display: none;
    }
  }
</style>

<script>
  /* Show / hide password. Safe to include more than once. */
  document.querySelectorAll("[data-toggle-password]").forEach(function (btn) {
    if (btn.dataset.ready) return;
    btn.dataset.ready = "1";
    btn.addEventListener("click", function () {
      var input = btn.parentElement.querySelector("input");
      var show = input.type === "password";
      input.type = show ? "text" : "password";
      btn.setAttribute("aria-pressed", show);
    });
  });
</script>
