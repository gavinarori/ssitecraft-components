<!--
  ShipX - welcome login with brand panel
  HOW TO USE
  1. Paste this whole file where you want the page.
  2. Image slots are marked with IMAGE comments: replace the link inside src="".
  3. Change the text and links. Colors are CSS variables at the top of the <style> block.
  - No photos needed: the hex pattern, orb and chips are CSS/SVG
  - Chips and the orb are easy to edit or remove
-->
<style>
  @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap");

  .login-shipx * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  .login-shipx {
    box-sizing: border-box;
    min-height: max(100vh, 640px);
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font), system-ui, sans-serif;
  }
  .login-shipx a {
    color: inherit;
    text-decoration: none;
  }
  .login-shipx img {
    display: block;
    object-fit: cover;
    background: #cfcfd6;
  }
  .login-shipx .ico {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .login-shipx .label {
    display: block;
    margin-bottom: 10px;
    font-size: 14px;
    font-weight: 500;
  }
  .login-shipx .input {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 50px;
    padding: 0 18px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--field);
    color: var(--muted);
    transition:
      border-color 0.2s,
      box-shadow 0.2s;
  }
  .login-shipx .input:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--ring);
  }
  .login-shipx .input input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--ink);
    font:
      400 14px var(--font),
      sans-serif;
  }
  .login-shipx .input input::placeholder {
    color: var(--muted);
  }
  .login-shipx .eye {
    display: grid;
    place-items: center;
    padding: 4px;
    border: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: color 0.2s;
  }
  .login-shipx .eye:hover,
  .login-shipx .eye[aria-pressed="true"] {
    color: var(--ink);
  }
  .login-shipx .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    height: 50px;
    border: 1px solid transparent;
    border-radius: var(--radius);
    font:
      500 15px var(--font),
      sans-serif;
    cursor: pointer;
    transition:
      transform 0.2s,
      box-shadow 0.25s,
      background 0.2s;
  }
  .login-shipx .btn:hover {
    transform: translateY(-1px);
  }
  .login-shipx .btn--primary {
    background: var(--accent);
    color: var(--accent-ink);
  }
  .login-shipx .btn--primary:hover {
    box-shadow: 0 14px 26px -14px var(--accent);
  }
  .login-shipx .btn--outline {
    border-color: var(--line);
    background: transparent;
    color: var(--ink);
    font-weight: 400;
  }
  .login-shipx .btn--outline:hover {
    background: var(--hover);
  }
  .login-shipx .btn .brand {
    width: 20px;
    height: 20px;
  }
  .login-shipx .divider {
    display: flex;
    align-items: center;
    gap: 14px;
    color: var(--muted);
    font-size: 14px;
  }
  .login-shipx .divider::before,
  .login-shipx .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  .login-shipx .check {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
  }
  .login-shipx .check input {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
  }
  .login-shipx .link {
    color: var(--accent);
    font-weight: 500;
  }
  .login-shipx .link:hover {
    text-decoration: underline;
  }
  .login-shipx .stack {
    display: grid;
    gap: 18px;
  }
  .login-shipx .dots {
    display: flex;
    gap: 9px;
  }
  .login-shipx .dots i {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.3);
    transition: transform 0.2s;
  }
  .login-shipx .dots i:first-child {
    background: #fff;
  }
  .login-shipx .dots i:hover {
    transform: scale(1.25);
  }
  @keyframes login-pulse {
    0% {
      transform: scale(0.8);
      opacity: 0.9;
    }
    100% {
      transform: scale(1.5);
      opacity: 0;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .login-shipx * {
      animation: none !important;
      transition: none !important;
    }
  }

  .login-shipx {
    --bg: #fff;
    --ink: #0b0b0b;
    --muted: #8a8a92;
    --line: #e6e6ea;
    --field: #fff;
    --hover: #f8f8fa;
    --accent: #6470c8;
    --accent-ink: #fff;
    --ring: rgba(100, 112, 200, 0.2);
    --radius: 999px;
    --font: Outfit;
    display: grid;
    grid-template-columns: 47% 53%;
  }
  .login-shipx .panel {
    display: flex;
    flex-direction: column;
    justify-content: center;
    width: min(362px, 100% - 48px);
    margin: 0 auto;
    padding: 48px 0;
  }
  .login-shipx .logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--accent);
    font-size: 24px;
    font-weight: 600;
  }
  .login-shipx .logo svg {
    width: 30px;
    height: 30px;
  }
  .login-shipx h1 {
    margin: 8px 0 6px;
    text-align: center;
    font-size: 42px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .login-shipx .sub {
    margin-bottom: 22px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }
  .login-shipx .socials {
    display: grid;
    gap: 10px;
  }
  .login-shipx .divider {
    margin: 20px 0;
  }
  .login-shipx .form {
    display: grid;
    gap: 10px;
  }
  .login-shipx .input {
    height: 50px;
  }
  .login-shipx .foot {
    margin-top: 24px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }
  .login-shipx .foot a {
    color: var(--ink);
    font-weight: 600;
  }
  .login-shipx .foot a:hover {
    text-decoration: underline;
  }
  .login-shipx .stage {
    position: relative;
    overflow: hidden;
    padding: clamp(40px, 6vh, 70px) 5.5%;
    border-left: 1px solid var(--line);
    background: #f7f7f9;
  }
  .login-shipx .hex {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .login-shipx .stage > *:not(.hex) {
    position: relative;
  }
  .login-shipx .say {
    font-size: clamp(52px, 6.6vw, 86px);
    font-weight: 700;
    line-height: 1.3;
    letter-spacing: -0.03em;
  }
  .login-shipx .name {
    display: inline-block;
    margin-top: 2px;
    padding: 0 20px;
    border: 1px solid rgba(0, 0, 0, 0.12);
    border-radius: 20px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.35));
    backdrop-filter: blur(6px);
    box-shadow: inset 40px 1px 0 -38px rgba(100, 112, 200, 0.9);
  }
  .login-shipx .orb {
    display: grid;
    place-items: center;
    width: 160px;
    height: 160px;
    margin: 56px 0 0 clamp(60px, 10vw, 180px);
    border-radius: 50%;
    background: radial-gradient(circle at 50% 30%, #fff, #ececef);
    box-shadow:
      inset 0 -10px 24px rgba(0, 0, 0, 0.06),
      0 20px 40px -18px rgba(0, 0, 0, 0.2);
    animation: shipx-float 6s ease-in-out infinite;
  }
  .login-shipx .orb svg {
    width: 74px;
    height: 74px;
  }
  .login-shipx .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 14px 12px;
    max-width: 520px;
    margin-top: 40px;
  }
  .login-shipx .chip {
    position: relative;
    padding: 14px 22px;
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(6px);
    font-size: 14px;
    transition:
      transform 0.25s,
      box-shadow 0.25s;
  }
  .login-shipx .chip::before {
    content: "";
    position: absolute;
    top: -1px;
    left: 22%;
    right: 22%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }
  .login-shipx .chip:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 26px -16px rgba(100, 112, 200, 0.7);
  }
  .login-shipx .cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 64px;
    padding: 8px;
    border: 1px dashed #cfcfd6;
    border-radius: 999px;
  }
  .login-shipx .cta span {
    padding: 14px 34px;
    border-radius: 999px;
    background: #efeff1;
    font-size: 20px;
    font-weight: 500;
  }
  .login-shipx .cta i {
    display: grid;
    place-items: center;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    transition: transform 0.3s;
  }
  .login-shipx .cta:hover i {
    transform: rotate(45deg);
  }
  .login-shipx .cta .ico {
    width: 22px;
    height: 22px;
  }
  @keyframes shipx-float {
    50% {
      transform: translateY(-8px);
    }
  }
  @media (max-width: 900px) {
    .login-shipx {
      grid-template-columns: 1fr;
    }
    .login-shipx .stage {
      display: none;
    }
  }
</style>

<section class="login-shipx">
  <!-- Form -->
  <div class="panel">
    <a href="#" class="logo"

        <g fill="#6470c8">

    </div>
    <div class="divider">or</div>

  <!-- Brand panel (pure CSS/SVG, no photos) -->

        <g fill="#6470c8">
          <rect x="2" y="2" width="12.500" height="12.500" rx="4" />
          <rect x="17.500" y="2" width="12.500" height="12.500" rx="4" />
          <rect x="2" y="17.500" width="12.500" height="12.500" rx="4" />
          <rect x="17.500" y="17.500" width="12.500" height="12.500" rx="4" />

    <div class="chips">
      <span class="chip">Inventory Management</span><span class="chip">Stock Analysis</span
      ><span class="chip">AI Insights</span><span class="chip">Sales Activity</span
      ><span class="chip">Product Activity</span>
    </div>
    <a href="#" class="cta"
      ><span>Work with us</span

</section>
