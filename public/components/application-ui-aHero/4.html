<!--
  Winzy Egypt — hero section
  HOW TO USE
  1. Paste this whole file where you want the hero.
  2. Every image is a placeholder. Search for the IMAGE and AVATAR comments and replace the link inside src="".
  3. Change the text, links and colors (colors live at the top of the <style> block).
  Fonts are loaded from Google Fonts by the @import line below.
-->
<style>
  @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");

  .hero-winzy-egypt,
  .hero-winzy-egypt * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  .hero-winzy-egypt {
    background: #fff;
    font-family: Inter, system-ui, sans-serif;
    color: #111;
  }
  .hero-winzy-egypt a {
    color: inherit;
    text-decoration: none;
  }
  .hero-winzy-egypt ul {
    list-style: none;
  }
  .hero-winzy-egypt {
    position: relative;
    overflow: hidden;
    min-height: max(100vh, 640px);
  }

  /* ---- Navigation ---- */
  .hero-winzy-egypt .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 22px 48px;
    position: relative;
    z-index: 5;
    font-size: 13px;
  }
  .hero-winzy-egypt .nav ul {
    display: flex;
    gap: 30px;
    align-items: center;
  }
  .hero-winzy-egypt .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 17px;
  }
  .hero-winzy-egypt .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px;
    border-radius: 99px;
    font-size: 13px;
    font-weight: 500;
    transition:
      transform 0.25s,
      box-shadow 0.25s;
    cursor: pointer;
    border: 0;
    font-family: inherit;
  }
  .hero-winzy-egypt .pill:hover {
    transform: translateY(-2px);
  }
  .hero-winzy-egypt .pill svg,
  .hero-winzy-egypt .icon-btn svg {
    width: 15px;
    height: 15px;
  }
  .hero-winzy-egypt .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: inline-grid;
    place-items: center;
    transition: transform 0.3s;
  }
  .hero-winzy-egypt .icon-btn:hover {
    transform: rotate(45deg);
  }
  .hero-winzy-egypt .avatars {
    display: flex;
  }
  .hero-winzy-egypt .avatars img {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 2px solid #fff;
    margin-left: -9px;
  }
  .hero-winzy-egypt .avatars img:first-child {
    margin-left: 0;
  }
  .hero-winzy-egypt .card {
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 20px 40px -18px rgba(0, 0, 0, 0.35);
  }
  .hero-winzy-egypt .spin {
    animation: winzy-egypt-spin 18s linear infinite;
  }
  @keyframes winzy-egypt-spin {
    to {
      transform: rotate(360deg);
    }
  }
  @keyframes winzy-egypt-float {
    50% {
      transform: translateY(-8px);
    }
  }
  .hero-winzy-egypt .float {
    animation: winzy-egypt-float 5s ease-in-out infinite;
  }
  .hero-winzy-egypt {
    background: #1a1713;
    color: #fff;
    font-family: Inter;
  }
  .hero-winzy-egypt .backdrop {
    position: absolute;
    inset: 0;
  }
  .hero-winzy-egypt .backdrop:after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(rgba(0, 0, 0, 0.2), transparent 40%, rgba(0, 0, 0, 0.55));
  }
  .hero-winzy-egypt .headline {
    position: absolute;
    left: 50%;
    top: 70px;
    transform: translateX(-50%);
    font: 700 clamp(120px, 24vw, 290px)/1 Inter;
    letter-spacing: -0.02em;
    background: linear-gradient(180deg, rgba(210, 210, 215, 0.75), rgba(120, 120, 128, 0.35));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    z-index: 1;
  }
  .hero-winzy-egypt svg.py {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 78%;
    z-index: 2;
  }
  .hero-winzy-egypt .nav {
    z-index: 6;
  }
  .hero-winzy-egypt .nav ul {
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(14px);
    padding: 12px 20px;
    border-radius: 99px;
    gap: 26px;
  }
  .hero-winzy-egypt .nav .btn-login {
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: rgba(255, 255, 255, 0.06);
  }
  .hero-winzy-egypt .nav .btn-signup {
    background: #fff;
    color: #111;
  }
  .hero-winzy-egypt .stats {
    position: absolute;
    left: 48px;
    bottom: 100px;
    display: flex;
    gap: 56px;
    z-index: 4;
  }
  .hero-winzy-egypt .stats b {
    font-size: 36px;
    font-weight: 600;
    display: block;
  }
  .hero-winzy-egypt .stats span {
    font-size: 14px;
    opacity: 0.8;
  }
  .hero-winzy-egypt .actions {
    position: absolute;
    left: 48px;
    bottom: 36px;
    display: flex;
    align-items: center;
    gap: 30px;
    z-index: 4;
    font-size: 13px;
  }
  .hero-winzy-egypt .actions p {
    max-width: 330px;
    line-height: 1.5;
    opacity: 0.9;
  }
  .hero-winzy-egypt .btn-book {
    background: #fff;
    color: #111;
    padding: 14px 26px;
    border-radius: 99px 0 0 99px;
    font-weight: 500;
  }
  .hero-winzy-egypt .thumb {
    position: absolute;
    right: 48px;
    bottom: 36px;
    width: 210px;
    background: rgba(40, 35, 30, 0.7);
    backdrop-filter: blur(16px);
    border-radius: 16px;
    padding: 9px;
    z-index: 4;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .hero-winzy-egypt .thumb img {
    height: 104px;
    border-radius: 10px;
  }
  .hero-winzy-egypt .thumb div.thumb-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    margin-top: 10px;
  }
  .hero-winzy-egypt .progress {
    display: flex;
    gap: 4px;
  }
  .hero-winzy-egypt .progress i {
    width: 26px;
    height: 2px;
    background: rgba(255, 255, 255, 0.3);
  }
  .hero-winzy-egypt .progress i:first-child {
    background: #fff;
  }

  /* ---- Responsive ---- */
  @media (max-width: 820px) {
    .hero-winzy-egypt .nav {
      padding: 18px 22px;
    }
    .hero-winzy-egypt .nav ul {
      display: none;
    }
    .hero-winzy-egypt .stats {
      gap: 26px;
      flex-wrap: wrap;
    }
    .hero-winzy-egypt .actions p,
    .hero-winzy-egypt .thumb {
      display: none;
    }
  }

  .hero-winzy-egypt .backdrop img {
    width: 100%;
    height: 100%;
  }
  .hero-winzy-egypt .thumb img {
    width: 100%;
  }
  /* ---- Images ---- */
  .hero-winzy-egypt img {
    display: block;
    object-fit: cover;
    background: #cfcfd6;
  }
  .hero-winzy-egypt .avatars img,
  .hero-winzy-egypt .avatars img,
  .hero-winzy-egypt .th img,
  .hero-winzy-egypt .au img,
  .hero-winzy-egypt .rv img {
    border-radius: 50%;
  }
  .hero-winzy-egypt .nav-icons .user-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
  }
</style>
